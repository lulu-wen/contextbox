<h1>ContextBox 欄位偵測</h1>
<button id="go">重新掃描這一頁</button>
<div id="out"></div>
<button id="setup" class="secondary">設定（貼鑰匙）</button>
<div class="hint">要你按下上面那顆按鈕才會動，平常一個字都不寫進你的網頁。<br>
只把值填進格子，<b>我不會幫你按送出</b>。<br>
敏感欄位每次都要你再點一次才填。<br>
它只連本機的 ContextBox（127.0.0.1），不連任何外面的網路。<br>
<b>要知道的事</b>：值一填進格子，那一頁的程式立刻讀得到，不用等你按送出。</div>
